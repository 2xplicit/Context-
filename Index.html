<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DABIT — Smart Odds Predictor</title>
  <style>
  :root{
    --red:#e03b3b;
    --dark-red:#b72b2b;
    --white:#ffffff;
    --gray:#f4f4f6;
    --muted:#777;
    --glass: rgba(255,255,255,0.9);
    --shadow: 0 6px 18px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box}
  body{
    font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
    background: linear-gradient(180deg,#fff 0%, #fff6f6 100%);
    color:#222;
    margin:0;
    padding:24px;
    display:flex;
    justify-content:center;
  }
  .container{
    width:960px;
    max-width:96%;
    background:var(--glass);
    border-radius:12px;
    padding:20px;
    box-shadow:var(--shadow);
    border:1px solid #ffecec;
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .header h1{
    margin:0;
    color:var(--red);
    letter-spacing:1px;
  }
  .subtitle{
    margin:0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .seeds{
    display:flex;
    gap:12px;
    margin-top:16px;
    align-items:end;
  }
  .seed-input{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .seed-input label{font-size:0.85rem;color:var(--muted);margin-bottom:6px}
  .seed-input input{
    padding:8px 10px;border-radius:8px;border:1px solid #eee;background:#fff;
  }
  .seed-actions{display:flex;gap:8px}
  .btn{padding:8px 12px;border-radius:8px;border:none;background:#fff;cursor:pointer;box-shadow:none}
  .btn.primary{background:var(--red);color:var(--white)}
  .btn.danger{background:#f3d2d2;color:var(--dark-red)}
  .predict-area{
    display:flex;
    gap:16px;
    margin-top:18px;
    align-items:flex-start;
  }
  .predict-panel{
    flex:1;
    background: linear-gradient(180deg,#fff 0%, #fff8f8 100%);
    border:1px solid #ffecec;
    padding:18px;border-radius:10px;
  }
  .odds-display{
    text-align:center;margin-bottom:18px;
  }
  .odds-display .label{color:var(--muted)}
  .odds{font-size:2.2rem;color:var(--dark-red);font-weight:700}
  .controls{display:flex;align-items:center;gap:16px;justify-content:center}
  .predict-btn{
    width:110px;height:110px;border-radius:999px;background:linear-gradient(180deg,var(--red),var(--dark-red));color:var(--white);
    border:none;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;
    box-shadow:0 8px 24px rgba(224,59,59,0.24);
  }
  .predict-btn.disabled{opacity:0.6;pointer-events:none}
  .predict-btn .progress-ring{
    position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none;
  }
  .progress-ring path{
    fill:none;stroke:rgba(255,255,255,0.18);stroke-width:5;stroke-linecap:round;
  }
  .predict-btn span{position:relative;z-index:2}
  .vote-buttons{display:flex;flex-direction:column;gap:8px}
  .vote{width:48px;height:44px;border-radius:8px;border:none;font-size:1.1rem;cursor:pointer}
  .vote.up{background: #dff7e0;color:#1d8a34}
  .vote.down{background: #ffe3e3;color:#b72828}
  .amount-panel{
    width:320px;
    padding:12px;border-radius:10px;background:#fff;border:1px solid #fff0f0;
  }
  .amount-area{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .amount-area input{padding:8px;border-radius:8px;border:1px solid #efe}
  .allocated{padding:10px;border-radius:8px;background:#f9f9fb;border:1px dashed #eee}
  .hidden{display:none}
  .financial-info{margin-top:12px;display:flex;justify-content:space-between;color:var(--muted)}
  .history{margin-top:18px}
  .history-list{max-height:240px;overflow:auto;border-radius:8px;padding:8px;background:#fff;border:1px solid #fff0f0}
  .history-entry{display:flex;justify-content:space-between;padding:8px;border-bottom:1px dashed #faf0f0}
  .history-entry .meta{font-size:0.9rem;color:var(--muted)}
  .footer{text-align:center;margin-top:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div id="app" class="container">
    <header class="header">
      <h1>DABIT</h1>
      <p class="subtitle">Smart A.I. odds predictor — color: red & white</p>
    </header>

    <section class="seeds">
      <div class="seed-input">
        <label>Server Seed</label>
        <input id="serverSeed" placeholder="Enter server seed" />
      </div>
      <div class="seed-input">
        <label>Client Seed</label>
        <input id="clientSeed" placeholder="Enter client seed" />
      </div>
      <div class="seed-actions">
        <button id="saveSeeds" class="btn primary">Save seeds</button>
        <button id="resetAll" class="btn danger">Reset</button>
      </div>
    </section>

    <section class="predict-area">
      <div class="predict-panel">
        <div class="odds-display">
          <div class="label">Predicted Odds</div>
          <div id="odds" class="odds">--.-</div>
        </div>

        <div class="controls">
          <button id="predictBtn" class="predict-btn">
            <svg viewBox="0 0 36 36" class="progress-ring"><path id="ringPath" /></svg>
            <span id="predictLabel">Predict</span>
          </button>

          <div class="vote-buttons">
            <button id="upBtn" class="vote up" title="Prediction correct (up)">▲</button>
            <button id="downBtn" class="vote down" title="Prediction wrong (down)">▼</button>
          </div>
        </div>
      </div>

      <div class="amount-panel">
        <button id="toggleAmount" class="btn">Manage Amount (Naira)</button>
        <div id="amountArea" class="amount-area hidden">
          <label>Main Balance (₦)</label>
          <input id="mainAmount" type="number" min="0" step="0.01" placeholder="Enter main amount in Naira" />

          <div class="displayed">
            <label>Allocated for current prediction (₦)</label>
            <div id="allocated" class="allocated">-</div>
          </div>
        </div>

        <div class="financial-info">
          <div>Accuracy: <span id="accuracy">0%</span></div>
          <div>Total Predictions: <span id="totalPred">0</span></div>
        </div>
      </div>
    </section>

    <section class="history">
      <h2>History</h2>
      <div id="historyList" class="history-list"></div>
    </section>

    <footer class="footer">
      <small>Made with ❤️ — DABIT (red & white)</small>
    </footer>
  </div>

  <script>
  // DABIT — single-file app

  const serverSeedInput = document.getElementById('serverSeed');
  const clientSeedInput = document.getElementById('clientSeed');
  const saveSeedsBtn = document.getElementById('saveSeeds');
  const resetAllBtn = document.getElementById('resetAll');
  const predictBtn = document.getElementById('predictBtn');
  const predictLabel = document.getElementById('predictLabel');
  const oddsEl = document.getElementById('odds');
  const upBtn = document.getElementById('upBtn');
  const downBtn = document.getElementById('downBtn');
  const toggleAmountBtn = document.getElementById('toggleAmount');
  const amountArea = document.getElementById('amountArea');
  const mainAmountInput = document.getElementById('mainAmount');
  const allocatedEl = document.getElementById('allocated');
  const historyList = document.getElementById('historyList');
  const accuracyEl = document.getElementById('accuracy');
  const totalPredEl = document.getElementById('totalPred');
  const ringPath = document.getElementById('ringPath');

  let interactionCount = 0;
  let currentOdd = null;
  let allocatedAmount = 0;
  let saved = {
    serverSeed: '',
    clientSeed: '',
  };
  const STORAGE_KEY = 'dabit_data_v1';
  let state = {
    history: [],
    mainAmount: 0,
    serverSeed: '',
    clientSeed: '',
    interactionCount: 0,
  };

  // initialize
  loadState();
  renderUI();

  // event handlers
  saveSeedsBtn.addEventListener('click', () => {
    saved.serverSeed = serverSeedInput.value || randomSeed();
    saved.clientSeed = clientSeedInput.value || randomSeed();
    state.serverSeed = saved.serverSeed;
    state.clientSeed = saved.clientSeed;
    state.interactionCount = 0;
    saveState();
    showToast('Seeds saved');
  });

  resetAllBtn.addEventListener('click', () => {
    if (!confirm('Reset all DABIT data and balances?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = { history: [], mainAmount: 0, serverSeed: '', clientSeed: '', interactionCount: 0 };
    saved = { serverSeed: '', clientSeed: '' };
    renderUI();
    showToast('Reset complete');
  });

  toggleAmountBtn.addEventListener('click', () => {
    amountArea.classList.toggle('hidden');
  });

  predictBtn.addEventListener('click', async () => {
    if (!state.serverSeed || !state.clientSeed) {
      alert('Please save server and client seeds first.');
      return;
    }
    if (predictBtn.classList.contains('disabled')) return;
    // start 2-second countdown with ring animation
    startCountdown(2000);
    predictBtn.classList.add('disabled');

    // Wait 2s to "reveal" the prediction
    await delay(2000);

    // generate odds
    interactionCount = ++state.interactionCount;
    const timestamp = Date.now();
    currentOdd = await generateOdd(state.serverSeed, state.clientSeed, interactionCount, timestamp);
    oddsEl.textContent = currentOdd.toFixed(2);

    // compute allocated amount using simple money management: inverse with odd
    state.mainAmount = parseFloat(mainAmountInput.value || state.mainAmount || 0);
    allocatedAmount = computeAllocation(state.mainAmount, currentOdd);
    allocatedEl.textContent = formatNumber(allocatedAmount.toFixed(2));

    // store an entry (pending outcome)
    const entry = {
      id: cryptoRandomId(),
      odd: currentOdd,
      allocated: allocatedAmount,
      timestamp,
      result: 'pending'
    };
    state.history.unshift(entry);
    saveState();
    renderUI();
    predictBtn.classList.remove('disabled');
  });

  upBtn.addEventListener('click', () => {
    markResult('win');
  });

  downBtn.addEventListener('click', () => {
    markResult('lose');
  });

  mainAmountInput.addEventListener('change', () => {
    state.mainAmount = parseFloat(mainAmountInput.value || 0);
    saveState();
  });

  // helpers

  function showToast(msg) {
    // basic toast
    console.log('DABIT:', msg);
  }

  function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

  function randomSeed() {
    // small random string
    return Math.random().toString(36).slice(2, 12);
  }

  async function generateOdd(serverSeed, clientSeed, count, timestamp) {
    // Create an input string mixing seeds, count and timestamp and a light bias derived from past results
    const baseInput = `${serverSeed}:${clientSeed}:${count}:${timestamp}`;
    const bias = computeBias(); // small bias in range [-2, +2]
    const hash = await sha256(baseInput);
    // Use first 8 bytes of hash to construct a float
    const first8 = hash.slice(0,16); // hex
    const intVal = parseInt(first8, 16);
    const maxInt = Math.pow(2, 64) - 1;
    const ratio = intVal / maxInt;
    // Map to 1.00 - 100.00
    let raw = 1 + ratio * 99;
    // apply small bias
    raw = raw + bias;
    if (raw < 1) raw = 1;
    if (raw > 100) raw = 100;
    // round to 2 decimals
    return Math.round(raw * 100) / 100;
  }

  function computeAllocation(main, odd) {
    // Money management rule:
    // - Percent of main to allocate = clamp(k / odd, min=0.01, max=0.2)
    // - For higher odds, allocate less
    if (!main || main <= 0) return 0;
    const k = 0.25; // tuning constant
    let portion = k / odd;
    portion = Math.max(0.01, Math.min(0.20, portion));
    const allocation = Math.floor((main * portion) * 100) / 100;
    return allocation;
  }

  function computeBias() {
    // Very simple bias computed from past history:
    // if recent wins concentrated on higher odds, nudge upwards; if wins on low odds, nudge downward
    const recent = state.history.slice(0, 200);
    if (!recent.length) return 0;
    const wins = recent.filter(r => r.result === 'win');
    if (!wins.length) return 0;
    const avgWinOdd = wins.reduce((s, w) => s + w.odd, 0) / wins.length;
    // If average win odd > 50, encourage slightly higher odds; else slightly lower
    const bias = (avgWinOdd - 50) / 100; // range approx [-0.5, +0.5]
    // clamp to [-2,2] to avoid big jumps
    if (bias > 2) return 2;
    if (bias < -2) return -2;
    return bias;
  }

  async function sha256(str) {
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    return hex;
  }

  function formatNumber(n) {
    return Number(n).toLocaleString();
  }

  function cryptoRandomId() {
    return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-6);
  }

  function markResult(kind) {
    // Find the latest pending prediction
    const pending = state.history.find(h => h.result === 'pending');
    if (!pending) {
      alert('No pending prediction to mark. Click Predict first.');
      return;
    }
    if (kind === 'win') {
      pending.result = 'win';
      // On win: multiply odd by allocated and add to main balance (profit) — per spec
      const profit = Math.round(pending.allocated * pending.odd * 100) / 100;
      state.mainAmount = Math.round((Number(state.mainAmount) + profit) * 100) / 100;
      // Optionally keep allocated amount separate — we treat profit as addition
    } else {
      pending.result = 'lose';
      // On loss: remove the allocated from main
      state.mainAmount = Math.round((Number(state.mainAmount) - pending.allocated) * 100) / 100;
      if (state.mainAmount < 0) state.mainAmount = 0;
    }
    // Save and render
    saveState();
    renderUI();
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      try {
        state = JSON.parse(raw);
        saved.serverSeed = state.serverSeed || '';
        saved.clientSeed = state.clientSeed || '';
        interactionCount = state.interactionCount || 0;
        if (!state.history) state.history = [];
        if (!state.mainAmount) state.mainAmount = 0;
      } catch(e){
        state = { history: [], mainAmount: 0, serverSeed: '', clientSeed: '', interactionCount: 0 };
      }
    }
  }

  // Render UI
  function renderUI(){
    serverSeedInput.value = state.serverSeed || '';
    clientSeedInput.value = state.clientSeed || '';
    mainAmountInput.value = state.mainAmount || '';
    // history
    historyList.innerHTML = '';
    for (const h of state.history.slice(0,200)) {
      const el = document.createElement('div');
      el.className = 'history-entry';
      const left = document.createElement('div');
      left.innerHTML = `<div><strong>Odd: ${h.odd.toFixed(2)}</strong> • ₦${formatNumber(h.allocated.toFixed(2))}</div><div class="meta">${new Date(h.timestamp).toLocaleString()}</div>`;
      const right = document.createElement('div');
      right.innerHTML = `<div>${h.result === 'pending' ? '<em>pending</em>' : (h.result === 'win' ? '<strong style="color:green">WIN</strong>' : '<strong style="color:red">LOSE</strong>')}</div>`;
      el.appendChild(left);
      el.appendChild(right);
      historyList.appendChild(el);
    }
    // stats
    const total = state.history.length;
    const wins = state.history.filter(h => h.result === 'win').length;
    const acc = total ? Math.round((wins / total) * 100) : 0;
    accuracyEl.textContent = `${acc}%`;
    totalPredEl.textContent = `${total}`;
    allocatedEl.textContent = allocatedAmount ? formatNumber(allocatedAmount.toFixed(2)) : '-';
    oddsEl.textContent = currentOdd ? currentOdd.toFixed(2) : '--.-';
  }

  // countdown visual
  function startCountdown(ms) {
    const start = Date.now();
    const update = () => {
      const elapsed = Date.now() - start;
      const pct = Math.min(1, elapsed / ms);
      drawRing(pct);
      if (pct < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
  }

  function drawRing(pct) {
    const R = 15; // radius in viewBox
    const cx = 18, cy = 18;
    const a = pct * Math.PI * 2;
    const x = cx + R * Math.cos(a - Math.PI/2);
    const y = cy + R * Math.sin(a - Math.PI/2);
    const large = a > Math.PI ? 1 : 0;
    const d = `M ${cx} ${cy - R} A ${R} ${R} 0 ${large} 1 ${x} ${y}`;
    ringPath.setAttribute('d', d);
    ringPath.setAttribute('stroke', 'rgba(255,255,255,0.9)');
    ringPath.setAttribute('stroke-width', 4);
  }
  </script>
</body>
</html>
